<script id="wa-nav-js">
// Wix's mobile menu needs Wix's runtime to open. This archive copy has no Wix
// scripts, so rebuild the menu from its own (hidden) links and open it on tap.
document.addEventListener('DOMContentLoaded', function () {
  var toggles = document.querySelectorAll('#MENU_AS_CONTAINER_TOGGLE, #TINY_MENU');
  if (!toggles.length) return;
  var nav = document.createElement('div');
  nav.id = 'wa-nav'; nav.setAttribute('role', 'dialog'); nav.setAttribute('aria-label', 'Site navigation');
  var close = document.createElement('button');
  close.className = 'x'; close.setAttribute('aria-label', 'Close menu'); close.textContent = '×';
  close.onclick = function () { nav.classList.remove('open'); };
  nav.appendChild(close);
  document.querySelectorAll('#MENU_AS_CONTAINER a[href], #TINY_MENU a[href]').forEach(function (a) {
    var label = a.textContent.trim(); if (!label) return;
    var link = document.createElement('a');
    link.href = a.getAttribute('href'); link.textContent = label;
    if (a.target) link.target = a.target;
    nav.appendChild(link);
  });
  document.body.appendChild(nav);
  toggles.forEach(function (el) {
    el.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); nav.classList.add('open'); }, true);
  });
});
</script>
